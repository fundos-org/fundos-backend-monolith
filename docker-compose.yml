services:
  backend-staging:
    container_name: backend-staging
    image: backend-staging:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8000"
    environment:
      - REDIS_HOST=redis-shared
      - REDIS_PORT=6379
      - ENVIRONMENT=production
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend-network

networks:
  backend-network:
    external: true